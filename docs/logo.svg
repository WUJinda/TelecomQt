    <rect x="30" y="63" width="14" height="19" rx="3.5" fill="#34d399"/>
    <line x1="61" y1="38" x2="61" y2="79" stroke="#f87171" stroke-width="4.5"/>
    <rect x="54" y="48" width="14" height="21" rx="3.5" fill="#f87171"/>
