  <path d="M16 86 C 34 90, 48 92, 62 78 S 90 64, 104 54" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 上升三连蜡烛：绿-红回调-绿 -->
