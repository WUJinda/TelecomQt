        const markPoints = [];
        if (has(oD)) markPoints.push({ coord: [oD, m.open.price], value: '开 ' + m.open.price, itemStyle: { color: '#4f9dff' } });
        if (has(cD)) markPoints.push({ coord: [cD, m.close.price], value: '平 ' + m.close.price, itemStyle: { color: '#c9a227' } });
        if (has(hD)) markPoints.push({ coord: [hD, m.h_left.price], value: 'H左', itemStyle: { color: '#e8a33d' } });

        const markLines = [];
        if (m.trigger_line != null) markLines.push({ yAxis: m.trigger_line, lineStyle: { type: 'dashed', color: '#8b93a1' }, label: { formatter: '触发位 ' + m.trigger_line, color: '#8b93a1', fontSize: 10 } });
        if (m.take_profit != null) markLines.push({ yAxis: m.take_profit, lineStyle: { type: 'dotted', color: '#4f9dff', opacity: 0.5 }, label: { formatter: '止盈·中轨', color: '#4f9dff', fontSize: 10 } });
        if (has(oD) && has(cD)) markLines.push([{ coord: [oD, m.open.price] }, { coord: [cD, m.close.price], lineStyle: { type: 'dashed', color: '#e5484d', opacity: 0.4 } }]);

        const stale = echarts.getInstanceByDom(el);
        if (stale) stale.dispose();
        this._kchart = null;
        el.innerHTML = '';
        this._kchart = echarts.init(el, 'dark');
        this._kchart.setOption({
          backgroundColor: 'transparent',
          legend: { data: ['布林上轨', '中轨(止盈)', '布林下轨'], top: 0, textStyle: { color: '#8b93a1' } },
          grid: { left: 62, right: 18, top: 36, bottom: 28 },
          tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
          xAxis: { type: 'category', data: cats, scale: true, boundaryGap: true, axisLabel: { color: '#8b93a1', fontSize: 10 } },
          yAxis: { scale: true, axisLabel: { color: '#8b93a1' }, splitLine: { lineStyle: { color: '#2a2f3a' } } },
          dataZoom: [{ type: 'inside', zoomOnMouseWheel: true, moveOnMouseWheel: false, moveOnMouseMove: true }],
          series: [
            { name: '布林上轨', type: 'line', data: up, smooth: true, symbol: 'none', lineStyle: { width: 1, opacity: 0.5, color: '#e5484d' } },
            { name: '中轨(止盈)', type: 'line', data: mid, smooth: true, symbol: 'none', lineStyle: { width: 1.2, opacity: 0.7, color: '#4f9dff' } },
            { name: '布林下轨', type: 'line', data: low, smooth: true, symbol: 'none', lineStyle: { width: 1, opacity: 0.5, color: '#30a46c' } },
            {
              type: 'candlestick', data: ohlc,
              itemStyle: { color: '#e5484d', color0: '#30a46c', borderColor: '#e5484d', borderColor0: '#30a46c' },
              markPoint: { data: markPoints, symbolSize: 38, label: { fontSize: 10, color: '#fff' } },
              markLine: { symbol: 'none', data: markLines, label: { fontSize: 10 } },
            },
          ],
        });
      },

      // ---- 格式化 ----
      fmtTime(s) { if (!s) return ''; return s.replace('T', ' '); },
      renderRef(text) {
        if (!text) return '';
        // 先 HTML 转义防止 XSS，再替换交叉引用
        let esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        return esc.replace(/\[\[report:([\w-]+)\]\]/g, (match, id) => {
          return `<a href="#" data-report-id="${id}" class="ref-link" onclick="event.preventDefault();window.__openReport('${id}')">📊 查看统计报告</a>`;
        });
      },
      async openReportById(id) {
        // 从交叉引用跳转
        if (this.tab !== 'analytics') this.switchTab('analytics');
        this.$nextTick(() => this.openReport(id));
      },

      // ===== 想法 CRUD =====
      fmtMoney(n) { if (n == null || n === '') return '—'; const v = Number(n); return (v >= 0 ? '+' : '') + v.toLocaleString('zh-CN', { maximumFractionDigits: 2 }); },
      paramsToText(p) {
        const map = {
          'bb_period': ['布林带周期', v => `${v} 根`],
          'bb_std': ['标准差倍数', v => `${v} σ`],
          'bandwidth_min': ['带宽阈值', v => `${v}`],
          'left_peak_lookback': ['扫描窗口', v => `${v} 根 K线`],
          'zone_lower': ['左峰区域下界', v => `${((v-1)*100).toFixed(1)}%`],
          'zone_upper': ['左峰区域上界', v => `+${((v-1)*100).toFixed(1)}%`],
          'bb_ddof': ['标准差自由度', v => `${v}`],
          'fee_rate': ['手续费率', v => `${(v*10000).toFixed(1)}‱`],
          'max_per_trade': ['单笔上限', v => `${(v/10000).toFixed(0)} 万`],
          'max_total_exposure': ['总敞口上限', v => `${(v/10000).toFixed(0)} 万`],
        };
        return Object.entries(p).map(([k, v]) => {
          const m = map[k];
          return m ? { label: m[0], value: m[1](v) } : { label: k, value: String(v) };
        });
      },
      dirLabel(d) { return d === 'short' ? '做空' : d === 'long' ? '做多' : (d || '—'); },
      pnlClass(n) { if (n == null) return ''; return Number(n) > 0 ? 'pos' : Number(n) < 0 ? 'neg' : ''; },
      negClass(n) { if (n == null) return ''; return Number(n) < 0 ? 'neg' : ''; },

      // ===== 回测中心 =====
      initBtData() {
        if (!this.btLoaded) {
          this.btLoaded = true;
          this.loadBtSessions();
          this.loadBtParams();
          this.loadBtDatasets();
        }
      },
      async loadBtSessions() {
        this.error = '';
        try {
          const r = await fetch('/api/backtest/sessions');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.btSessions = await r.json();
        } catch (e) { this.error = '加载会话列表失败：' + e.message; console.error(e); }
      },
      async createBtSession() {
        if (!this.btNewSessionName.trim()) return;
        this.error = '';
        try {
          const r = await fetch('/api/backtest/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.btNewSessionName.trim() })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const session = await r.json();
          this.btSessions.push(session);
          this.btSessionRecords[session.id] = [];
          this.btNewSessionName = '';
          this.btShowNewSession = false;
          this.selectBtSession(session.id);
          // 自动展开新会话
          this.toggleSessionExpand(session.id);
        } catch (e) { this.error = '创建会话失败：' + e.message; console.error(e); }
      },
      async deleteBtSession(id) {
        if (!confirm('确定删除此会话及其所有回测记录？')) return;
        this.error = '';
        try {
          const r = await fetch('/api/backtest/sessions/' + id, { method: 'DELETE' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.btSessions = this.btSessions.filter(s => s.id !== id);
          delete this.btSessionRecords[id];
          delete this.btExpandedSessions[id];
          if (this.btCurrentSessionId === id) {
            this.btCurrentSessionId = null;
            this.btCurrentResult = null;
            this.btCurrentRecordId = null;
            this.disposeBtChart();
          }
        } catch (e) { this.error = '删除会话失败：' + e.message; console.error(e); }
      },
      selectBtSession(id) {
        // 只设置当前会话（用于参数配置上下文），不加载记录也不清除结果
        this.btCurrentSessionId = id;
      },
      async toggleSessionExpand(id) {
        // 展开/收起会话的记录列表
        if (!this.btExpandedSessions[id]) {
          // 首次展开：懒加载记录
          if (!this.btSessionRecords[id]) {
            try {
              const r = await fetch('/api/backtest/sessions/' + id + '/records');
              if (!r.ok) throw new Error('HTTP ' + r.status);
              this.btSessionRecords[id] = await r.json();
            } catch (e) { this.error = '加载回测记录失败：' + e.message; console.error(e); return; }
          }
          this.btExpandedSessions[id] = true;
        } else {
          this.btExpandedSessions[id] = false;
        }
      },
      async loadBtParams() {
        this.error = '';
        try {
          const r = await fetch('/api/backtest/strategy-params');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          this.btParamGroups = data.groups || [];
          this.resetBtParams();
        } catch (e) { this.error = '加载策略参数失败：' + e.message; console.error(e); }
      },
      resetBtParams() {
        const params = {};
        for (const group of this.btParamGroups) {
          for (const p of (group.params || [])) {
            params[p.key] = p.default;
          }
        }
        this.btCurrentParams = params;
      },
      async loadBtDatasets() {
        this.error = '';
        try {
          const r = await fetch('/api/backtest/datasets');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          // 后端返回 dict 列表，前端只需要 instrument 字符串列表
          this.btDatasets = (data.instruments || data || []).map(d =>
            typeof d === 'string' ? d : d.instrument
          );
          // 默认勾选前5个
          this.btSelectedInstruments = this.btDatasets.slice(0, 5);
        } catch (e) { this.error = '加载品种列表失败：' + e.message; console.error(e); }
      },
      filteredBtDatasets() {
        const q = this.btDatasetSearch.trim().toLowerCase();
        if (!q) return this.btDatasets;
        return this.btDatasets.filter(d => String(d).toLowerCase().includes(q));
      },
      async runBacktest() {
        if (!this.btCurrentSessionId || this.btSelectedInstruments.length === 0 || this.btRunning) return;
        this.btRunning = true;
        this.error = '';
        this.disposeBtChart();
        try {
          const r = await fetch('/api/backtest/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              session_id: this.btCurrentSessionId,
              label: this.btLabel || '',
              instruments: this.btSelectedInstruments,
              params: this.btCurrentParams
            })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          // run API 返回 {record_id, experiment_id, summary, experiment}
          const exp = data.experiment || data;
          this.btCurrentResult = exp;
          this.btCurrentRecordId = data.record_id;
          // 刷新当前会话的记录列表（树状结构）
          const sid = this.btCurrentSessionId;
          try {
            const rr = await fetch('/api/backtest/sessions/' + sid + '/records');
            if (rr.ok) this.btSessionRecords[sid] = await rr.json();
          } catch (_) {}
          // 刷新会话列表的 record_count
          await this.loadBtSessions();
          this.btCurrentRecordId = data.record_id;
          // 渲染图表
          this.$nextTick(() => this.renderBtChart());
        } catch (e) { this.error = '回测执行失败：' + e.message; console.error(e); }
        this.btRunning = false;
      },
      async openBtRecord(id) {
        this.error = '';
        this.disposeBtChart();
        try {
          const r = await fetch('/api/backtest/records/' + id);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          this.btCurrentResult = data.experiment || data;
          this.btCurrentRecordId = id;
          this.$nextTick(() => this.renderBtChart());
        } catch (e) { this.error = '加载回测记录失败：' + e.message; console.error(e); }
      },
      async deleteBtRecord(id) {
        if (!confirm('确定删除此回测记录？')) return;
        this.error = '';
        try {
          const r = await fetch('/api/backtest/records/' + id, { method: 'DELETE' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          // 从所有会话的记录列表中移除
          for (const sid in this.btSessionRecords) {
            this.btSessionRecords[sid] = this.btSessionRecords[sid].filter(r => r.id !== id);
          }
          // 刷新会话列表的 record_count
          await this.loadBtSessions();
          if (this.btCurrentRecordId === id) {
            this.btCurrentResult = null;
            this.btCurrentRecordId = null;
            this.disposeBtChart();
          }
        } catch (e) { this.error = '删除记录失败：' + e.message; console.error(e); }
      },
      disposeBtChart() {
        if (this.btChart) { this.btChart.dispose(); this.btChart = null; }
        const el = document.getElementById('bt-chart');
        if (el) { const stale = echarts.getInstanceByDom(el); if (stale) stale.dispose(); }
      },
      renderBtChart() {
        const el = document.getElementById('bt-chart');
        if (!el || !this.btCurrentResult) return;
        // 同 renderChart：DOM 可能刚插入尚未布局，RAF 等到就绪
        if (!el.offsetWidth || !el.offsetHeight) {
          requestAnimationFrame(() => this.renderBtChart());
          return;
        }
        const stale = echarts.getInstanceByDom(el);
        if (stale) stale.dispose();
        this.btChart = null;

        const trades = [];
        for (const inst of (this.btCurrentResult.instruments || [])) {
          for (const t of (inst.trades || [])) {
            trades.push({ date: t.close_date, pnl: t.net_pnl || 0 });
          }
        }
        if (!trades.length) {
          el.innerHTML = '<div class="empty" style="display:flex;align-items:center;justify-content:center;height:100%">本报告无交易记录</div>';
          return;
        }
        trades.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        let cum = 0;
        const xs = [], ys = [];
        for (const t of trades) { cum += t.pnl; xs.push(t.date); ys.push(+cum.toFixed(2)); }
        el.innerHTML = '';
        this.btChart = echarts.init(el, 'dark');
        this.btChart.setOption({
          backgroundColor: 'transparent',
          grid: { left: 64, right: 20, top: 20, bottom: 40 },
          tooltip: { trigger: 'axis' },
          xAxis: { type: 'category', data: xs, axisLabel: { color: '#8b93a1' } },
          yAxis: { type: 'value', name: '累计盈亏', axisLabel: { color: '#8b93a1' }, splitLine: { lineStyle: { color: '#2a2f3a' } } },
          series: [{
            type: 'line', step: 'end', showSymbol: true, symbolSize: 6,
            data: ys, lineStyle: { width: 2, color: '#e5484d' },
            areaStyle: { opacity: 0.12, color: '#e5484d' }
          }]
        });
      },
      btAllTrades() {
        if (!this.btCurrentResult) return [];
        const out = [];
        for (const inst of (this.btCurrentResult.instruments || [])) {
          for (const t of (inst.trades || [])) {
            out.push({
              instrument: inst.instrument,
              open_date: t.open_date, open_price: t.open_price,
              close_date: t.close_date, close_price: t.close_price,
              volume: t.volume, holding_days: t.holding_days,
              net_pnl: t.net_pnl, return_rate: t.return_rate
            });
          }
        }
        return out;
      },
      // ===== 展开/收缩 =====
      toggleExpand() {
        this.btExpanded = !this.btExpanded;
        // 展开后等 DOM 重排完成再 resize 图表（双重 RAF 确保布局已就绪）
        if (this.btChart) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (this.btChart) this.btChart.resize();
            });
          });
        }
      },
      // ===== 归入会话 =====
      startImport() {
        // 确保会话列表已加载
        if (!this.btSessions.length) {
          this.loadBtSessions().then(() => { this.importing = true; });
        } else {
          this.importing = true;
        }
      },
      async doImport(experimentId) {
        if (!this.importSessionId) { this.error = '请先选择会话'; return; }
        this.error = '';
        try {
          const r = await fetch('/api/backtest/sessions/' + this.importSessionId + '/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ experiment_id: experimentId })
          });
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.detail || ('HTTP ' + r.status));
          }
          const data = await r.json();
          this.importing = false;
          this.importSessionId = '';
          this.error = '';
          // 提示成功
          alert('✅ 已归入会话');
        } catch (e) { this.error = '归入会话失败：' + e.message; console.error(e); }
      },
    }));
  });
</script>
<script defer src="/assets/alpine.min.js"></script>
