<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>来财 · 策略协作面板</title>
  <script src="/assets/echarts.min.js"></script>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a;
      --text:#e6e8eb; --muted:#8b93a1; --accent:#4f9dff;
      --pos:#e5484d; --neg:#30a46c;            /* 红涨绿跌 */
    }
    *{box-sizing:border-box}
    /* 自定义滚动条 — 全局统一 */
    *{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    a{color:var(--accent);text-decoration:none}
    header.top{display:flex;align-items:center;gap:12px;padding:14px 20px;
      border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
    header.top .title{font-size:17px;font-weight:600}
    header.top .badge{font-size:11px;color:var(--muted);border:1px solid var(--border);
      padding:1px 7px;border-radius:10px}
    nav.tabs{display:flex;gap:4px;margin-left:16px}
    nav.tabs button{background:none;border:none;color:var(--muted);cursor:pointer;
      padding:6px 12px;border-radius:8px;font-size:14px}
    nav.tabs button.active{background:var(--panel2);color:var(--text)}
    main{max-width:1100px;margin:0 auto;padding:20px}
    .muted{color:var(--muted)}
    .pos{color:var(--pos)} .neg{color:var(--neg)}

    /* 指标卡 */
    .metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
    .card .k{font-size:12px;color:var(--muted)}
    .card .v{font-size:20px;font-weight:600;margin-top:4px}
    @media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}
    .metrics-4{grid-template-columns:repeat(2,1fr)!important}}

    /* 表格 */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
    th{color:var(--muted);font-weight:500;text-align:right;background:var(--panel)}
    th.l,td.l{text-align:left}
    tbody tr{cursor:pointer}
    tbody tr:hover{background:var(--panel2)}
    .wrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:14px 0}
    .wrap .hd{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .pill{font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);
      padding:2px 9px;border-radius:12px}

    button.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
      padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
    button.btn:hover{border-color:var(--accent)}
    select,option{background:var(--panel2);color:var(--text);border:1px solid var(--border);
      padding:5px 8px;border-radius:8px}
    #chart{width:100%;height:280px}
    details{margin:8px 0}
    details summary{cursor:pointer;color:var(--muted)}
    .empty{text-align:center;color:var(--muted);padding:50px 0}
    .skel{color:var(--muted);padding:30px 0;text-align:center}
    .note{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px dashed var(--border);padding-top:12px}
    .err{background:#3a1d1f;border:1px solid var(--pos);color:#ffb3b6;padding:10px 14px;border-radius:8px;margin:14px 0;font-size:13px}

    /* 表单 / 卡片 / 看板（M2） */
    input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);
      padding:6px 10px;border-radius:8px;font:inherit;width:100%}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .form-grid .full{grid-column:1 / -1}
    .form-grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:760px){.kanban{grid-template-columns:1fr}}
    .kanban .col{min-width:0}
    .kanban h4{margin:0 0 8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
    .item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
    .item .ttl{font-weight:600;margin-bottom:4px}
    .item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
    .item .row{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
    .item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
    .btn.sm{font-size:12px;padding:3px 8px}
    .btn.danger{border-color:var(--pos);color:#ffb3b6}
    .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
    .ref-link{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent);cursor:pointer}
    .ref-link:hover{opacity:0.8}
    /* 交易筛选器 */
    select.opt-pos{border-color:var(--pos);color:var(--pos)}
    select.opt-neg{border-color:var(--neg);color:var(--neg)}
    select.opt-anomaly{border-color:#e8a33d;color:#e8a33d}
    .anomaly-badge{display:inline-block;background:#3a2a0e;border:1px solid #e8a33d;color:#e8a33d;
      padding:0 5px;border-radius:8px;font-size:11px;margin-left:4px;cursor:help;white-space:nowrap}
    td.warn{color:#e8a33d;font-weight:600}

    /* ===== 回测中心 ===== */
    .bt-layout{display:flex;gap:14px;min-height:calc(100vh - 80px)}
    .bt-col-left{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;
      overflow-y:auto;max-height:calc(100vh - 100px)}
    .bt-session-item{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 4px;border-radius:8px;
      cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:background .15s}
    .bt-session-item:hover{background:var(--panel2)}
    .bt-session-item.active{background:var(--panel2);border-color:var(--accent)}
    .bt-tree-arrow{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
      font-size:9px;color:var(--muted);cursor:pointer;flex-shrink:0;text-align:center}
    .bt-tree-arrow:hover{color:var(--accent)}
    .bt-tree-leaf{display:flex;align-items:center;gap:2px;padding:5px 6px 5px 24px;border-radius:6px;
      cursor:pointer;margin-bottom:1px;border:1px solid transparent;transition:background .15s}
    .bt-tree-leaf:hover{background:var(--panel2)}
    .bt-tree-leaf.active{background:var(--panel2);border-color:var(--accent)}
    .bt-col-mid{display:flex;flex-direction:column;max-height:calc(100vh - 100px);padding-right:2px}
    .bt-param-row{margin-bottom:8px}
    .bt-param-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
    .bt-param-row input[type="number"]{width:100%}
    .bt-instrument-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);
      border-radius:8px;padding:6px;background:var(--panel)}
    .bt-instrument-item{display:flex;align-items:center;gap:6px;padding:3px 6px;
      font-size:13px;cursor:pointer;border-radius:4px}
    .bt-instrument-item:hover{background:var(--panel2)}
    .bt-instrument-item input[type="checkbox"]{width:auto!important;accent-color:var(--accent)}
    .bt-record-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
      cursor:pointer;margin-bottom:4px;border:1px solid var(--border);transition:background .15s}
    .bt-record-item:hover{background:var(--panel2)}
    .bt-record-item.active{background:var(--panel2);border-color:var(--accent)}
    .bt-col-right{overflow-y:auto;max-height:calc(100vh - 100px);padding-right:2px}
    #bt-chart{width:100%;height:280px}
    @media(max-width:900px){
      .bt-layout{flex-direction:column;min-height:auto}
      .bt-col-left{max-height:none;width:auto!important}
      .bt-col-mid,.bt-col-right{max-height:none;width:auto!important}
    }
  </style>
</head>
<body>
<div x-data="panel">
  <header class="top">
    <span class="title">📈 来财 · 策略协作面板</span>
    <span class="badge">v0.1</span>
    <nav class="tabs">
      <button :class="tab==='reports' && 'active'" @click="switchTab('reports')">回测报告</button>
      <button :class="tab==='ideas' && 'active'" @click="switchTab('ideas')">策略想法</button>
      <button :class="tab==='plans' && 'active'" @click="switchTab('plans')">交易计划</button>
      <button :class="tab==='symbols' && 'active'" @click="switchTab('symbols')">品种查询</button>
      <button :class="tab==='analytics' && 'active'" @click="switchTab('analytics')">统计报告</button>
      <button :class="tab==='backtest' && 'active'" @click="switchTab('backtest')">🧪 回测中心</button>
    </nav>
  </header>

  <main :style="tab==='backtest' && 'max-width:1500px'">
    <div x-show="error" class="err" x-text="error" style="margin-top:14px"></div>

    <!-- ============ 报告 ============ -->
    <section x-show="tab==='reports'">

      <!-- 列表 -->
      <template x-if="tab==='reports' && !current && !loadingDetail">
        <div>
          <h3 style="margin:6px 0">回测实验</h3>
          <div class="wrap" style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th class="l">策略</th><th>生成时间</th><th>方向</th>
                  <th>总盈亏</th><th>胜率</th><th>笔数</th><th>有交易品种</th><th>最大回撤</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="e in experiments" :key="e.experiment_id">
                  <tr @click="open(e.experiment_id)">
                    <td class="l" x-text="e.strategy_name"></td>
                    <td x-text="fmtTime(e.generated_at)" class="muted"></td>
                    <td x-text="dirLabel(e.direction)"></td>
                    <td :class="pnlClass(e.total_pnl)" x-text="fmtMoney(e.total_pnl)"></td>
                    <td x-text="e.win_rate==null?'—':e.win_rate+'%'"></td>
                    <td x-text="e.total_trades ?? '—'"></td>
                    <td x-text="e.instruments_with_trades ?? '—'"></td>
                    <td :class="negClass(e.max_drawdown)" x-text="fmtMoney(e.max_drawdown)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div x-show="!loadingList && experiments.length===0" class="empty">还没有回测报告。把 experiment.json 放进 backend/data/experiments/ 后刷新。</div>
          <div x-show="loadingList" class="skel">加载中…</div>
        </div>
      </template>

      <!-- 详情加载骨架 -->
      <div x-show="tab==='reports' && !current && loadingDetail" class="skel">加载报告详情…</div>

      <!-- 详情 -->
      <template x-if="tab==='reports' && current">
        <div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <button class="btn" @click="back()">← 返回列表</button>
            <h3 style="margin:0" x-text="current.strategy_name"></h3>
            <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
              <!-- 归入会话 -->
              <select x-model="importSessionId" x-show="importing" style="width:160px">
                <option value="">选择会话…</option>
                <template x-for="s in btSessions" :key="s.id">
                  <option :value="s.id" x-text="s.name"></option>
                </template>
              </select>
              <button class="btn sm" x-show="importing && importSessionId" @click="doImport(current.experiment_id)">✓ 确认</button>
              <button class="btn sm" x-show="importing" @click="importing=false;importSessionId=''">取消</button>
              <button class="btn sm" x-show="!importing" @click="startImport()">📁 归入会话</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span class="pill" x-text="fmtTime(current.generated_at)"></span>
            <span class="pill" x-text="dirLabel(current.direction)"></span>
            <span class="pill" x-show="current.mode" x-text="'模式: '+current.mode"></span>
          </div>

          <div style="display:flex;gap:6px;margin:12px 0">
            <button class="btn" :style="subtab==='overview' && 'background:var(--accent);border-color:var(--accent);color:#fff'" @click="switchSub('overview')">📊 总览</button>
            <button class="btn" :style="subtab==='replay' && 'background:var(--accent);border-color:var(--accent);color:#fff'" @click="switchSub('replay')">🔍 逐笔复盘</button>
          </div>

          <!-- ===== 总览 ===== -->
          <div x-show="subtab==='overview'">
          <div class="metrics">
            <div class="card"><div class="k">总盈亏</div><div class="v" :class="pnlClass(s().total_pnl)" x-text="fmtMoney(s().total_pnl)"></div></div>
            <div class="card"><div class="k">总收益率</div><div class="v" :class="pnlClass(s().total_return_rate)" x-text="(s().total_return_rate??0)+'%'"></div></div>
            <div class="card"><div class="k">胜率</div><div class="v" x-text="(s().win_rate??0)+'%'"></div></div>
            <div class="card"><div class="k">交易笔数</div><div class="v" x-text="s().total_trades??0"></div></div>
            <div class="card"><div class="k">最大回撤</div><div class="v" :class="negClass(s().max_drawdown)" x-text="fmtMoney(s().max_drawdown)"></div></div>
            <div class="card"><div class="k">有交易品种</div><div class="v" x-text="(s().instruments_with_trades??0)+' / '+(s().instruments_tested??0)"></div></div>
          </div>

          <!-- 收益曲线 -->
          <div class="wrap">
            <div class="hd"><b>累计盈亏曲线</b><span class="muted" style="font-size:12px">（按平仓日累计净盈亏）</span></div>
            <div id="chart" x-ref="chart"></div>
          </div>

          <!-- 品种 + 交易明细 -->
          <div class="wrap">
            <div class="hd">
              <b>逐笔交易明细</b>
              <select x-model="tradeFilter" :class="{'opt-pos': tradeFilter==='profit', 'opt-neg': tradeFilter==='loss', 'opt-anomaly': tradeFilter==='anomaly'}">
                <option value="all">全部交易</option>
                <option value="profit">🔴 盈利交易</option>
                <option value="loss">🟢 亏损交易</option>
                <option value="anomaly">⚠️ 异常交易</option>
              </select>
              <select x-model.number="selectedInst" x-show="tradeFilter==='all'">
                <template x-for="it in instsTraded()" :key="it.inst.instrument">
                  <option :value="it.i" x-text="instIcon(it.inst.instrument) + it.inst.instrument + '（' + (it.inst.trade_count||0) + '笔）'"></option>
                </template>
              </select>
              <span class="muted" style="font-size:12px" x-show="tradeFilter==='all' && curInst()">交易所 <span x-text="curInst()?.exchange"></span> · 周期 <span x-text="curInst()?.kline_style"></span> · 乘数 <span x-text="curInst()?.volume_multiple"></span></span>
              <span class="muted" style="font-size:12px" x-show="tradeFilter!=='all'">共筛选出 <b style="color:var(--text)" x-text="filteredTrades().length"></b> 笔交易</span>
            </div>
            <div style="overflow-x:auto">
              <!-- 全部模式：按品种查看 -->
              <table x-show="tradeFilter==='all'">
                <thead>
                  <tr>
                    <th class="l">#</th><th class="l">方向</th>
                    <th>开仓日期</th><th>开仓价</th><th>平仓日期</th><th>平仓价</th>
                    <th>手数</th><th>持仓天</th><th>保证金</th><th>点数</th><th>净盈亏</th><th>收益率</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(t,i) in (curInst()?.trades||[])" :key="i">
                    <tr>
                      <td class="l">
                        <span x-text="t.no||i+1"></span>
                        <span class="anomaly-badge" x-show="isAnomaly(t)" :title="anomalyText(t)">⚠</span>
                      </td>
                      <td class="l" x-text="dirLabel(current.direction)"></td>
                      <td x-text="t.open_date"></td><td x-text="t.open_price"></td>
                      <td x-text="t.close_date"></td><td x-text="t.close_price"></td>
                      <td x-text="t.volume"></td>
                      <td :class="{'warn': (t.holding_days||0) > 20}" x-text="t.holding_days"></td>
                      <td x-text="fmtMoney(t.margin)"></td><td x-text="t.points"></td>
                      <td :class="pnlClass(t.net_pnl)" x-text="fmtMoney(t.net_pnl)"></td>
                      <td :class="pnlClass(t.return_rate)" x-text="(t.return_rate??0)+'%'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <!-- 筛选模式：全品种扁平列表 -->
              <table x-show="tradeFilter!=='all'">
                <thead>
                  <tr>
                    <th class="l">#</th><th class="l">品种</th>
                    <th>开仓日期</th><th>开仓价</th><th>平仓日期</th><th>平仓价</th>
                    <th>手数</th><th>持仓天</th><th>保证金</th><th>点数</th><th>净盈亏</th><th>收益率</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(it,i) in filteredTrades()" :key="i">
                    <tr>
                      <td class="l">
                        <span x-text="i+1"></span>
                        <span class="anomaly-badge" x-show="isAnomaly(it.trade)" :title="anomalyText(it.trade)">⚠</span>
                      </td>
                      <td class="l" x-text="instIcon(it.inst.instrument) + it.inst.instrument"></td>
                      <td x-text="it.trade.open_date"></td><td x-text="it.trade.open_price"></td>
                      <td x-text="it.trade.close_date"></td><td x-text="it.trade.close_price"></td>
                      <td x-text="it.trade.volume"></td>
                      <td :class="{'warn': (it.trade.holding_days||0) > 20}" x-text="it.trade.holding_days"></td>
                      <td x-text="fmtMoney(it.trade.margin)"></td><td x-text="it.trade.points"></td>
                      <td :class="pnlClass(it.trade.net_pnl)" x-text="fmtMoney(it.trade.net_pnl)"></td>
                      <td :class="pnlClass(it.trade.return_rate)" x-text="(it.trade.return_rate??0)+'%'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div x-show="tradeFilter==='all' && !(curInst()?.trades||[]).length" class="empty">该品种本轮无交易。</div>
              <div x-show="tradeFilter!=='all' && filteredTrades().length===0" class="empty">没有符合条件的交易。</div>
            </div>
          </div>

          <details>
            <summary>策略参数</summary>
            <div class="params-grid" style="padding:8px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px;font-size:13px">
              <template x-for="p in paramsToText(current.params||{})" :key="p.label">
                <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:3px 0">
                  <span class="muted" x-text="p.label"></span>
                  <b x-text="p.value"></b>
                </div>
              </template>
            </div>
          </details>

          <div class="note">说明：收益曲线按平仓日累计；明细里的盈亏已扣手续费。「总收益率」= 总净盈亏 ÷ 总占用保证金（未按时间加权，并非账户实际收益率）。颜色遵循期货「红涨绿跌」。</div>
          </div><!-- /总览 -->

          <!-- ===== 逐笔复盘 ===== -->
          <div x-show="subtab==='replay'">
            <div class="wrap">
              <div class="hd">
                <b>交易选择器</b>
                <select x-model="tradeFilter" :class="{'opt-pos': tradeFilter==='profit', 'opt-neg': tradeFilter==='loss', 'opt-anomaly': tradeFilter==='anomaly'}" @change="selectedTrade=0; $nextTick(()=>renderKline())">
                  <option value="all">全部交易</option>
                  <option value="profit">🔴 盈利交易</option>
                  <option value="loss">🟢 亏损交易</option>
                  <option value="anomaly">⚠️ 异常交易</option>
                </select>
                <select x-model.number="selectedTrade" @change="$nextTick(()=>renderKline())">
                  <template x-for="(it,i) in filteredTrades()" :key="i">
                    <option :value="i" x-text="it.label + (isAnomaly(it.trade) ? ' ⚠' : '')"></option>
                  </template>
                </select>
                <span class="muted" style="font-size:12px" x-show="filteredTrades().length">共 <span x-text="filteredTrades().length"></span> 笔交易</span>
              </div>
            </div>

            <div x-show="!allTrades().length" class="empty">本报告没有交易记录。</div>
            <div x-show="allTrades().length && !filteredTrades().length" class="empty">没有符合条件的交易。</div>
            <div x-show="filteredTrades().length && !curChart()" class="empty">该笔交易没有 K 线复盘数据（experiment.json 未提供 chart 字段）。</div>

            <div x-show="curChart()">
              <div x-show="curChart()?.markers.no_stop_loss" class="note" style="color:var(--pos);border-color:var(--pos)">⚠ 本策略不设止损，止盈 = 布林中轨（价格回到中轨即平仓）</div>
              <div class="wrap">
                <div class="hd"><b x-text="replayTitle()"></b></div>
                <div id="kchart" x-ref="kchart" style="width:100%;height:400px"></div>
              </div>

              <!-- 交易结论卡片 -->
              <div class="metrics metrics-4" style="grid-template-columns:repeat(4,1fr);margin:14px 0 0">
                <div class="card">
                  <div class="k">收益</div>
                  <div class="v" :class="pnlClass(curTrade()?.net_pnl)" x-text="fmtMoney(curTrade()?.net_pnl)"></div>
                </div>
                <div class="card">
                  <div class="k">收益率</div>
                  <div class="v" :class="pnlClass(curTrade()?.return_rate)" x-text="(curTrade()?.return_rate ?? 0) + '%'"></div>
                  <span class="muted" style="font-size:11px">(<span x-text="(curTrade()?.points >= 0 ? '+' : '') + curTrade()?.points"></span> / <span x-text="curTrade()?.open_price"></span>)</span>
                </div>
                <div class="card">
                  <div class="k">开仓价格</div>
                  <div class="v" x-text="curTrade()?.open_price ?? '—'"></div>
                </div>
                <div class="card">
                  <div class="k">平仓价格</div>
                  <div class="v" x-text="curTrade()?.close_price ?? '—'"></div>
                </div>
              </div>

              <!-- 策略参数卡片 -->
              <div class="metrics metrics-4" style="grid-template-columns:repeat(4,1fr);margin:10px 0 0">
                <div class="card">
                  <div class="k">带宽阈值</div>
                  <div class="v" style="font-size:16px" x-text="(current?.params?.bandwidth_min ?? '—')"></div>
                </div>
                <div class="card">
                  <div class="k">超越左峰阈值</div>
                  <div class="v" style="font-size:16px" x-text="(((current?.params?.zone_upper ?? 1) - 1) * 100).toFixed(0) + '%' + ' ~ ' + (((current?.params?.zone_lower ?? 1) - 1) * 100).toFixed(0) + '%'"
                    ></div>
                  <span class="muted" style="font-size:11px">(<span x-text="curChart()?.markers.h_left ? '+' + (curTrade()?.open_price - curChart()?.markers.h_left.price).toFixed(1) : '—'"></span>)</span>
                </div>
                <div class="card">
                  <div class="k">扫描窗口阈值</div>
                  <div class="v" style="font-size:16px" x-text="(current?.params?.left_peak_lookback ?? '—') + ' 根'"></div>
                </div>
                <div class="card">
                  <div class="k">启动扫描位置</div>
                  <div class="v" style="font-size:16px">中轨</div>
                </div>
              </div>

              <div class="wrap" style="padding:14px;line-height:1.9">
                <div x-text="curChart()?.summary"></div>
                <div class="muted" style="margin-top:10px;font-size:12px">
                  开仓时带宽分位 <b style="color:var(--text)" x-text="(curChart()?.bw_pct_at_open ?? '—') + '%'"></b> ·
                  触发位(中下轨中间) <span style="color:var(--text)" x-text="curChart()?.markers.trigger_line"></span> ·
                  止盈(开仓时中轨) <span style="color:var(--text)" x-text="curChart()?.markers.take_profit"></span> ·
                  左峰 H_left <span style="color:var(--text)" x-text="curChart()?.markers.h_left?.price"></span>
                </div>
              </div>
            </div>
          </div><!-- /复盘 -->
        </div>
      </template>
    </section>

    <!-- ============ 想法 ============ -->
    <section x-show="tab==='ideas'">
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <b x-text="ideaEditingId ? '编辑想法 #' + ideaEditingId : '💡 新增策略想法'"></b>
          <button x-show="ideaEditingId" class="btn sm" @click="resetIdeaForm()">取消编辑</button>
        </div>
        <div class="form-grid">
          <div class="full">
            <label>策略名 *</label>
            <input x-model="ideaForm.name" placeholder="例：日线双峰左侧做空">
          </div>
          <div>
            <label>品种</label>
            <input x-model="ideaForm.instrument" placeholder="rb / ag / sn / MA …" list="instrument-list">
          </div>
          <div>
            <label>周期</label>
            <select x-model="ideaForm.timeframe">
              <option value="">（不限）</option>
              <option>2H</option><option>4H</option><option>1D</option>
            </select>
          </div>
          <div>
            <label>开仓条件</label>
            <input x-model="ideaForm.entry_condition" placeholder="例：跌破布林中下轨中间位">
          </div>
          <div>
            <label>平仓条件</label>
            <input x-model="ideaForm.exit_condition" placeholder="例：回到布林中轨">
          </div>
          <div>
            <label>止损</label>
            <input x-model="ideaForm.stop_loss" placeholder="价格或说明">
          </div>
          <div>
            <label>止盈</label>
            <input x-model="ideaForm.take_profit" placeholder="价格或说明">
          </div>
          <div>
            <label>手数</label>
            <input x-model="ideaForm.volume" placeholder="例：2手">
          </div>
          <div>
            <label>作者</label>
            <select x-model="ideaForm.author"><option>DAREWIN</option><option>朋友</option></select>
          </div>
          <div class="full">
            <label>备注</label>
            <textarea x-model="ideaForm.note" rows="2" placeholder="观察、假设、待验证点…"></textarea>
          </div>
        </div>
        <div style="margin-top:10px">
          <button class="btn accent" @click="saveIdea()" x-text="ideaEditingId ? '保存修改' : '添加想法'"></button>
        </div>
      </div>

      <datalist id="instrument-list">
        <template x-for="v in allSymbols" :key="v.prefix">
          <option :value="v.prefix + ' ' + (v.name||'')"></option>
        </template>
      </datalist>

      <template x-for="st in ['新想法','已转回测','已采纳','已搁置']" :key="st">
        <div class="wrap" style="margin-bottom:14px">
          <div class="hd">
            <b x-text="st"></b>
            <span class="pill" x-text="ideasByStatus(st).length"></span>
          </div>
          <div style="padding:12px">
            <div x-show="ideasByStatus(st).length===0" class="empty" style="padding:20px 0">暂无</div>
            <template x-for="it in ideasByStatus(st)" :key="it.id">
              <div class="item" style="margin-bottom:10px">
                <div class="ttl" x-text="it.name"></div>
                <div class="meta">
                  <span class="pill" x-show="it.instrument" x-text="it.instrument"></span>
                  <span class="pill" x-show="it.timeframe" x-text="it.timeframe"></span>
                  <span class="pill" x-show="it.volume" x-text="it.volume"></span>
                  <span class="muted" style="font-size:12px" x-text="it.author + ' · ' + fmtTime((it.created_at||'').slice(0,19))"></span>
                </div>
                <div class="row" x-show="it.entry_condition"><b>开仓：</b><span x-text="it.entry_condition"></span></div>
                <div class="row" x-show="it.exit_condition"><b>平仓：</b><span x-text="it.exit_condition"></span></div>
                <div class="row" x-show="it.stop_loss || it.take_profit"><b x-show="it.stop_loss">止损：</b><span x-show="it.stop_loss" x-text="it.stop_loss"></span><span x-show="it.stop_loss && it.take_profit">　</span><b x-show="it.take_profit">止盈：</b><span x-show="it.take_profit" x-text="it.take_profit"></span></div>
                <div class="row" x-show="it.note" x-html="renderRef(it.note)"></div>
                <div class="acts">
                  <template x-for="ns in ['新想法','已转回测','已采纳','已搁置']" :key="ns">
                    <button class="btn sm" x-show="ns!==it.status" @click="setIdeaStatus(it, ns)" x-text="'→ '+ns"></button>
                  </template>
                  <button class="btn sm" @click="editIdea(it)">编辑</button>
                  <button class="btn sm danger" @click="deleteIdea(it.id)">删除</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- ============ 计划 ============ -->
    <section x-show="tab==='plans'">
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <b x-text="planEditingId ? '编辑计划 #' + planEditingId : '📋 新增交易计划'"></b>
          <button x-show="planEditingId" class="btn sm" @click="resetPlanForm()">取消编辑</button>
        </div>
        <div class="form-grid">
          <div>
            <label>品种</label>
            <input x-model="planForm.instrument" placeholder="rb / ag / sn …" list="instrument-list">
          </div>
          <div>
            <label>方向</label>
            <select x-model="planForm.direction"><option>多</option><option>空</option></select>
          </div>
          <div>
            <label>计划入场</label>
            <input x-model="planForm.planned_entry" placeholder="价格或区间 4200-4250">
          </div>
          <div>
            <label>计划日期</label>
            <input type="date" x-model="planForm.planned_date">
          </div>
          <div>
            <label>止损</label>
            <input x-model="planForm.stop_loss" placeholder="价格">
          </div>
          <div>
            <label>目标</label>
            <input x-model="planForm.target" placeholder="价格">
          </div>
          <div>
            <label>手数</label>
            <input x-model="planForm.volume" placeholder="例：2手">
          </div>
          <div>
            <label>作者</label>
            <select x-model="planForm.author"><option>DAREWIN</option><option>朋友</option></select>
          </div>
          <div class="full">
            <label>备注</label>
            <textarea x-model="planForm.note" rows="2"></textarea>
          </div>
          <template x-if="planEditingId">
            <div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div>
                <label>实际入场（回填）</label>
                <input x-model="planForm.actual_entry" placeholder="执行后填写">
              </div>
              <div>
                <label>实际盈亏（回填）</label>
                <input x-model="planForm.actual_pnl" placeholder="例：+6300 / -1500">
              </div>
            </div>
          </template>
        </div>
        <div style="margin-top:10px">
          <button class="btn accent" @click="savePlan()" x-text="planEditingId ? '保存修改' : '添加计划'"></button>
        </div>
      </div>

      <div class="kanban">
        <template x-for="st in ['计划中','已执行','已放弃']" :key="st">
          <div class="col">
            <h4><span x-text="st"></span><span class="pill" x-text="plansByStatus(st).length"></span></h4>
            <div x-show="plansByStatus(st).length===0" class="empty" style="padding:20px 0">暂无</div>
            <template x-for="pl in plansByStatus(st)" :key="pl.id">
              <div class="item" style="margin-bottom:10px">
                <div class="ttl">
                  <span x-text="(pl.instrument||'?') + ' '"></span>
                  <span :class="pl.direction==='多' ? 'pos' : 'neg'" x-text="pl.direction"></span>
                </div>
                <div class="meta">
                  <span class="pill" x-show="pl.volume" x-text="pl.volume"></span>
                  <span class="pill" x-show="pl.planned_date" x-text="pl.planned_date"></span>
                  <span class="muted" style="font-size:12px" x-text="pl.author"></span>
                </div>
                <div class="row" x-show="pl.planned_entry"><b>入场：</b><span x-text="pl.planned_entry"></span></div>
                <div class="row" x-show="pl.stop_loss || pl.target"><b x-show="pl.stop_loss">止损：</b><span x-show="pl.stop_loss" x-text="pl.stop_loss"></span><span x-show="pl.stop_loss && pl.target">　</span><b x-show="pl.target">目标：</b><span x-show="pl.target" x-text="pl.target"></span></div>
                <template x-if="pl.status==='已执行'">
                  <div class="row" style="border-top:1px dashed var(--border);margin-top:6px;padding-top:6px">
                    <span x-show="pl.actual_entry"><b>实际：</b><span x-text="pl.actual_entry"></span>　</span>
                    <span :class="pnlClass(parsePnl(pl.actual_pnl))"><b>盈亏：</b><span x-text="pl.actual_pnl || '—'"></span></span>
                  </div>
                </template>
                <div class="row" x-show="pl.note" x-text="pl.note"></div>
                <div class="acts">
                  <template x-for="ns in ['计划中','已执行','已放弃']" :key="ns">
                    <button class="btn sm" x-show="ns!==pl.status" @click="setPlanStatus(pl, ns)" x-text="'→ '+ns"></button>
                  </template>
                  <button class="btn sm" @click="editPlan(pl)">编辑</button>
                  <button class="btn sm danger" @click="deletePlan(pl.id)">删除</button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </section>

    <!-- ============ 品种查询 ============ -->
    <section x-show="tab==='symbols'" x-init="$watch('tab', v => { if (v==='symbols' && !symbolsLoaded) loadSymbols() })">
      <!-- 搜索栏 -->
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px;position:relative">
            <input
              x-model="symbolQuery"
              @input="filterSymbols()"
              type="text"
              placeholder="输入品种名称（螺纹钢）或英文缩写（RB）或交易所（SHFE）…"
              style="width:100%;padding:10px 14px;font-size:15px"
              x-ref="symbolSearch"
            >
          </div>
          <button class="btn" @click="symbolQuery=''; filterSymbols()" x-show="symbolQuery">清除</button>
        </div>
        <div class="muted" style="font-size:12px;margin-top:8px">
          支持模糊搜索：中文品种名 · 英文代码 · 交易所缩写 · 共 <span x-text="allSymbols.length"></span> 个品种
        </div>
      </div>

      <!-- 品种分组表格 -->
      <template x-for="ex in symbolExchanges" :key="ex">
        <div class="wrap" style="margin-bottom:14px" x-show="filteredSymbolsByExchange(ex).length">
          <div class="hd">
            <b x-text="exFullName(ex)"></b>
            <span class="pill" x-text="filteredSymbolsByExchange(ex).length"></span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th class="l">代码</th>
                  <th class="l">名称</th>
                  <th>交易所</th>
                  <th>乘数</th>
                  <th>已有合约</th>
                  <th>合约明细</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="v in filteredSymbolsByExchange(ex)" :key="v.prefix">
                  <tr>
                    <td class="l">
                      <b x-text="v.prefix.toUpperCase()"></b>
                    </td>
                    <td class="l" x-text="v.name || '—'"></td>
                    <td x-text="v.exchange"></td>
                    <td x-text="v.multiplier"></td>
                    <td>
                      <span :class="v.has_data ? 'pos' : 'muted'" x-text="v.has_data ? v.contract_count + ' 个' : '无'"></span>
                    </td>
                    <td class="l">
                      <template x-if="v.contracts.length">
                        <span class="muted" style="font-size:12px" x-text="v.contracts.map(c => c.symbol).join(', ')"></span>
                      </template>
                      <template x-if="!v.contracts.length">
                        <span class="muted" style="font-size:12px">—</span>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <div x-show="!symbolsLoaded" class="skel">加载中…</div>
      <div x-show="symbolsLoaded && filteredSymbols.length===0" class="empty">未找到匹配「<span x-text="symbolQuery"></span>」的品种</div>
    </section>

    <!-- ============ 统计报告 ============ -->
    <section x-show="tab==='analytics'" x-init="$watch('tab', v => { if (v==='analytics' && !analyticsLoaded) loadAnalytics() })">

      <!-- 列表视图 -->
      <template x-if="tab==='analytics' && !currentReport">
        <div>
          <div class="metrics" style="grid-template-columns:1fr">
            <div class="card">
              <div class="k">统计报告</div>
              <div class="v" style="font-size:14px;color:var(--muted)">策略统计、形态分析、参数优化报告</div>
            </div>
          </div>
          <div style="margin-bottom:12px">
            <button class="btn sm" :style="analyticsStarredOnly ? 'background:#f5a623;border-color:#f5a623;color:#fff' : ''" @click="analyticsStarredOnly=!analyticsStarredOnly">★ 仅看星标</button>
            <span class="muted" style="font-size:12px;margin-left:8px" x-show="analyticsStarredOnly" x-text="`已标 ${analyticsList.filter(r=>r.starred).length} 篇`"></span>
          </div>
          <template x-for="r in filteredAnalytics()" :key="r.report_id">
            <div class="wrap" style="cursor:pointer;margin-bottom:12px" @click="openReport(r.report_id)">
              <div class="hd">
                <b x-text="r.title"></b>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="pill" x-text="r.strategy_type || '—'"></span>
                  <span @click="toggleStar(r.report_id, $event)" style="cursor:pointer;font-size:18px;line-height:1" :style="r.starred ? 'color:#f5a623' : 'color:#666'" :title="r.starred ? '取消星标' : '添加星标'" x-text="r.starred ? '★' : '☆'"></span>
                </div>
              </div>
              <div class="muted" style="font-size:13px;line-height:1.6;padding:4px 0" x-text="r.description"></div>
              <div class="muted" style="font-size:12px;margin-top:4px">
                <span x-text="r.created_at?.slice(0,10) || '—'"></span>
              </div>
            </div>
          </template>
          <div x-show="analyticsLoaded && filteredAnalytics().length===0" class="empty" x-text="analyticsStarredOnly ? '没有星标报告' : '暂无统计报告'"></div>
          <div x-show="!analyticsLoaded" class="skel">加载中…</div>
        </div>
      </template>

      <!-- 详情视图 -->
      <template x-if="tab==='analytics' && currentReport">
        <div>
          <div style="margin-bottom:14px">
            <button class="btn" @click="currentReport=null; subtab=''">← 返回列表</button>
          </div>

          <!-- 报告标题 -->
          <div class="wrap" style="margin-bottom:14px">
            <div class="hd">
              <b x-text="currentReport.title"></b>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="pill" x-text="currentReport.strategy_type || '—'"></span>
                <span @click="toggleStar(currentReport.report_id)" style="cursor:pointer;font-size:18px;line-height:1" :style="(analyticsList.find(x=>x.report_id===currentReport.report_id)?.starred) ? 'color:#f5a623' : 'color:#666'" :title="analyticsList.find(x=>x.report_id===currentReport.report_id)?.starred ? '取消星标' : '添加星标'" x-text="analyticsList.find(x=>x.report_id===currentReport.report_id)?.starred ? '★' : '☆'"></span>
              </div>
            </div>
            <template x-if="currentReport.description">
              <div class="muted" style="font-size:13px;line-height:1.8;padding:8px 0;white-space:pre-wrap" x-html="renderRef(currentReport.description)"></div>
            </template>
          </div>

          <!-- 汇总卡片 -->
          <template x-if="currentReport.summary && currentReport.summary.length">
            <div class="metrics" :style="`grid-template-columns:repeat(${Math.min(currentReport.summary.length, 6)},1fr)`">
              <template x-for="s in currentReport.summary" :key="s.label">
                <div class="card">
                  <div class="k" x-text="s.label"></div>
                  <div class="v" style="font-size:16px" x-text="s.value"></div>
                </div>
              </template>
            </div>
          </template>

          <!-- 章节内容 -->
          <template x-for="(sec, si) in (currentReport.sections||[])" :key="si">
            <div class="wrap" style="margin-top:14px">
              <div class="hd"><b x-text="sec.title"></b></div>
              <template x-if="sec.content">
                <div style="padding:8px 0;line-height:1.8;font-size:13px;white-space:pre-wrap" x-text="sec.content"></div>
              </template>
              <!-- 数据表格 -->
              <template x-for="(tbl, ti) in (sec.tables||[])" :key="ti">
                <div style="margin-top:10px">
                  <template x-if="tbl.caption">
                    <div class="muted" style="font-size:12px;margin-bottom:4px" x-text="tbl.caption"></div>
                  </template>
                  <div style="overflow-x:auto">
                    <table>
                      <thead>
                        <tr>
                          <template x-for="(h, hi) in tbl.headers" :key="hi">
                            <th :class="hi===0 && 'l'" x-text="h"></th>
                          </template>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(row, ri) in tbl.rows" :key="ri">
                          <tr>
                            <template x-for="(cell, ci) in row" :key="ci">
                              <td :class="ci===0 && 'l'" x-text="cell"></td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- 分析结论区 -->
          <div class="wrap" style="margin-top:14px">
            <div class="hd"><b>分析结论</b></div>
            <template x-for="c in (currentReport.comments||[]).filter(c => c.conclusion)" :key="c.id">
              <div style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div style="font-size:13px;line-height:1.8" x-text="c.content"></div>
                <div class="muted" style="font-size:12px;margin-top:4px">
                  <b x-text="c.author"></b> · <span x-text="c.created_at?.slice(0,16).replace('T',' ') || ''"></span>
                  <button class="btn" style="margin-left:8px;padding:2px 8px;font-size:11px" @click="deleteComment(c.id)">删除</button>
                </div>
              </div>
            </template>
            <div x-show="!(currentReport.comments||[]).some(c => c.conclusion)" class="muted" style="padding:8px 0;font-size:13px">暂无正式结论</div>
          </div>

          <!-- 评论区 -->
          <div class="wrap" style="margin-top:14px">
            <div class="hd"><b>评论与讨论</b></div>
            <template x-for="c in (currentReport.comments||[]).filter(c => !c.conclusion)" :key="c.id">
              <div style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div style="font-size:13px;line-height:1.8" x-text="c.content"></div>
                <div class="muted" style="font-size:12px;margin-top:4px">
                  <b x-text="c.author"></b> · <span x-text="c.created_at?.slice(0,16).replace('T',' ') || ''"></span>
                  <button class="btn" style="margin-left:8px;padding:2px 8px;font-size:11px" @click="deleteComment(c.id)">删除</button>
                </div>
              </div>
            </template>
            <div x-show="!(currentReport.comments||[]).some(c => !c.conclusion)" class="muted" style="padding:8px 0;font-size:13px">暂无评论</div>

            <!-- 发表评论 -->
            <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border)">
              <textarea x-model="commentForm.content" placeholder="写下你的评论或分析…" style="width:100%;min-height:70px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:13px;resize:vertical"></textarea>
              <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
                <input x-model="commentForm.author" placeholder="署名" style="width:120px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px">
                <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer">
                  <input type="checkbox" x-model="commentForm.conclusion"> 标记为正式分析结论
                </label>
                <button class="btn" style="margin-left:auto" @click="submitComment()" :disabled="!commentForm.content.trim()">提交</button>
              </div>
            </div>
          </div>

        </div>
      </template>
    </section>

    <!-- ============ 回测中心 ============ -->
    <section x-show="tab==='backtest'">
      <div class="bt-layout">
        <!-- 左栏：会话管理 -->
        <div class="bt-col-left" x-show="!btExpanded" style="width:240px;flex-shrink:0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <b style="font-size:14px">📁 测试会话</b>
            <button class="btn sm" @click="btShowNewSession = !btShowNewSession" :style="btShowNewSession && 'border-color:var(--accent)'">➕</button>
          </div>
          <div x-show="btShowNewSession" style="margin-bottom:10px">
            <input x-model="btNewSessionName" @keydown.enter="createBtSession()" placeholder="输入会话名称…" style="font-size:13px">
            <div style="display:flex;gap:4px;margin-top:4px">
              <button class="btn sm accent" @click="createBtSession()">创建</button>
              <button class="btn sm" @click="btShowNewSession=false;btNewSessionName=''">取消</button>
            </div>
          </div>
          <!-- 树状结构：会话 → 回测记录 -->
          <template x-for="s in btSessions" :key="s.id">
            <div>
              <!-- 会话行 -->
              <div class="bt-session-item" :class="{'active': btCurrentSessionId === s.id}" @click="selectBtSession(s.id)">
                <span class="bt-tree-arrow" @click.stop="toggleSessionExpand(s.id)" x-text="btExpandedSessions[s.id] ? '▼' : '▶'"></span>
                <div style="flex:1;min-width:0;cursor:pointer">
                  <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="s.name"></div>
                  <div class="muted" style="font-size:11px" x-text="(s.record_count||0) + ' 条回测'"></div>
                </div>
                <button class="btn sm danger" @click.stop="deleteBtSession(s.id)" style="flex-shrink:0;padding:2px 6px;font-size:11px">✕</button>
              </div>
              <!-- 子记录列表 -->
              <div x-show="btExpandedSessions[s.id]" x-transition.opacity>
                <template x-for="r in (btSessionRecords[s.id]||[])" :key="r.id">
                  <div class="bt-tree-leaf" :class="{'active': btCurrentRecordId === r.id}" @click="openBtRecord(r.id)">
                    <span class="muted" style="font-size:11px;flex-shrink:0;margin-right:2px">├</span>
                    <div style="flex:1;min-width:0">
                      <div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px">
                        <span x-text="r.label || '(无标注)'"></span>
                        <span class="pill" style="font-size:8px;padding:0 3px;line-height:14px" x-show="r.source==='external'">外</span>
                      </div>
                      <div style="display:flex;gap:6px;font-size:10px" class="muted">
                        <span :class="pnlClass(r.total_pnl)" x-text="fmtMoney(r.total_pnl)"></span>
                        <span x-text="(r.total_trades||0)+'笔'"></span>
                      </div>
                    </div>
                    <button class="btn sm danger" @click.stop="deleteBtRecord(r.id)" style="flex-shrink:0;padding:1px 4px;font-size:10px">✕</button>
                  </div>
                </template>
                <div x-show="(btSessionRecords[s.id]||[]).length===0" class="muted" style="font-size:11px;padding:4px 0 4px 28px">暂无记录</div>
              </div>
            </div>
          </template>
          <div x-show="btSessions.length===0" class="empty" style="padding:20px 0;font-size:13px">暂无会话<br><span style="font-size:11px">点击 ➕ 创建</span></div>
        </div>

        <!-- 中栏：参数配置 + 回测列表 -->
        <div class="bt-col-mid" x-show="!btExpanded" style="width:360px;flex-shrink:0">
          <!-- 上半部分：可滚动 -->
          <div style="flex:1;overflow-y:auto">
          <!-- 参数配置 -->
          <div class="card" style="margin-bottom:14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <b style="font-size:14px">⚙️ 参数配置</b>
              <button class="btn sm" @click="resetBtParams()">↩ 恢复默认</button>
            </div>
            <template x-for="group in btParamGroups" :key="group.name">
              <details open style="margin-bottom:6px">
                <summary style="font-size:13px;font-weight:600;color:var(--text)" x-text="group.name"></summary>
                <div style="padding:8px 0 0 12px">
                  <template x-for="p in group.params" :key="p.key">
                    <div class="bt-param-row">
                      <label x-text="p.label"></label>
                      <input type="number" :min="p.min" :max="p.max" :step="p.step" x-model.number="btCurrentParams[p.key]">
                    </div>
                  </template>
                </div>
              </details>
            </template>
            <div x-show="btParamGroups.length===0" class="muted" style="font-size:12px;padding:8px 0">加载参数定义中…</div>
          </div>

          <!-- 品种选择 -->
          <div class="card" style="margin-bottom:14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <b style="font-size:14px">📦 选择品种</b>
              <span class="muted" style="font-size:12px">已选 <b style="color:var(--accent)" x-text="btSelectedInstruments.length"></b>/<span x-text="btDatasets.length"></span></span>
            </div>
            <input x-model="btDatasetSearch" placeholder="搜索品种…" style="font-size:13px;margin-bottom:6px">
            <div class="bt-instrument-list">
              <template x-for="d in filteredBtDatasets()" :key="d">
                <label class="bt-instrument-item">
                  <input type="checkbox" :value="d" x-model="btSelectedInstruments">
                  <span x-text="d"></span>
                </label>
              </template>
              <div x-show="filteredBtDatasets().length===0" class="muted" style="font-size:12px;padding:6px">无匹配品种</div>
            </div>
          </div>
          </div><!-- /可滚动区域 -->

          <!-- 下半部分：回测标注 + 执行（固定底部） -->
          <div style="flex-shrink:0;border-top:1px solid var(--border);padding-top:14px;margin-top:0">
          <!-- 回测标注 + 执行 -->
          <div class="card">
            <label style="font-size:12px;color:var(--muted)">回测标注</label>
            <input x-model="btLabel" placeholder="给这次回测起个名字，如 bw=0.18" style="margin-top:2px">
            <button class="btn accent" style="width:100%;margin-top:10px;padding:8px;font-size:14px"
                    @click="runBacktest()"
                    :disabled="btRunning || !btCurrentSessionId || btSelectedInstruments.length===0">
              <span x-show="!btRunning">🔄 开始回测</span>
              <span x-show="btRunning">⏳ 回测中…</span>
            </button>
            <div x-show="!btCurrentSessionId" class="muted" style="font-size:11px;margin-top:4px;text-align:center">请先选择或创建会话</div>
          </div>
          </div><!-- /固定底部 -->
        </div>

        <!-- 右栏：结果展示 -->
        <div class="bt-col-right" style="flex:1;min-width:0">
          <template x-if="btCurrentResult">
            <div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
                <h3 style="margin:0;font-size:16px" x-text="btCurrentResult.strategy_name || '回测结果'"></h3>
                <span class="pill" x-show="btCurrentResult.direction" x-text="dirLabel(btCurrentResult.direction)"></span>
                <span class="pill" x-show="btCurrentResult.generated_at" x-text="fmtTime(btCurrentResult.generated_at)"></span>
                <div style="margin-left:auto;display:flex;gap:6px">
                  <button class="btn sm" @click="toggleExpand()" x-text="btExpanded ? '⤡ 收起' : '⤢ 展开'"></button>
                </div>
              </div>

              <!-- 指标卡 -->
              <div class="metrics">
                <div class="card"><div class="k">总盈亏</div><div class="v" :class="pnlClass(btCurrentResult.summary?.total_pnl)" x-text="fmtMoney(btCurrentResult.summary?.total_pnl)"></div></div>
                <div class="card"><div class="k">总收益率</div><div class="v" :class="pnlClass(btCurrentResult.summary?.total_return_rate)" x-text="(btCurrentResult.summary?.total_return_rate??0)+'%'"></div></div>
                <div class="card"><div class="k">胜率</div><div class="v" x-text="(btCurrentResult.summary?.win_rate??0)+'%'"></div></div>
                <div class="card"><div class="k">交易笔数</div><div class="v" x-text="btCurrentResult.summary?.total_trades??0"></div></div>
                <div class="card"><div class="k">最大回撤</div><div class="v" :class="negClass(btCurrentResult.summary?.max_drawdown)" x-text="fmtMoney(btCurrentResult.summary?.max_drawdown)"></div></div>
                <div class="card"><div class="k">有交易品种</div><div class="v" x-text="(btCurrentResult.summary?.instruments_with_trades??0)+' / '+(btCurrentResult.summary?.instruments_tested??0)"></div></div>
              </div>

              <!-- 收益曲线 -->
              <div class="wrap">
                <div class="hd"><b>累计盈亏曲线</b><span class="muted" style="font-size:12px">（按平仓日累计净盈亏）</span></div>
                <div id="bt-chart" x-ref="btchart"></div>
              </div>

              <!-- 逐笔交易明细 -->
              <div class="wrap">
                <div class="hd"><b>逐笔交易明细</b></div>
                <div style="overflow-x:auto">
                  <table>
                    <thead>
                      <tr>
                        <th class="l">#</th><th class="l">品种</th>
                        <th>开仓日期</th><th>开仓价</th><th>平仓日期</th><th>平仓价</th>
                        <th>手数</th><th>持仓天</th><th>净盈亏</th><th>收益率</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(t, i) in btAllTrades()" :key="i">
                        <tr>
                          <td class="l" x-text="i+1"></td>
                          <td class="l" x-text="instIcon(t.instrument) + t.instrument"></td>
                          <td x-text="t.open_date"></td><td x-text="t.open_price"></td>
                          <td x-text="t.close_date"></td><td x-text="t.close_price"></td>
                          <td x-text="t.volume"></td>
                          <td :class="{'warn': (t.holding_days||0) > 20}" x-text="t.holding_days"></td>
                          <td :class="pnlClass(t.net_pnl)" x-text="fmtMoney(t.net_pnl)"></td>
                          <td :class="pnlClass(t.return_rate)" x-text="(t.return_rate??0)+'%'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div x-show="btAllTrades().length===0" class="empty">无交易记录</div>
                </div>
              </div>

              <!-- 策略参数快照 -->
              <details style="margin-top:14px">
                <summary>策略参数快照</summary>
                <div class="params-grid" style="padding:8px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px;font-size:13px">
                  <template x-for="p in paramsToText(btCurrentResult.params||{})" :key="p.label">
                    <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:3px 0">
                      <span class="muted" x-text="p.label"></span>
                      <b x-text="p.value"></b>
                    </div>
                  </template>
                </div>
              </details>
            </div>
          </template>

          <!-- 空状态 -->
          <template x-if="!btCurrentResult">
            <div class="empty" style="padding:80px 0">
              <div style="font-size:48px;margin-bottom:10px">🧪</div>
              <div>选择一条回测记录查看结果，或配置参数后开始回测</div>
              <button class="btn sm" style="margin-top:12px" @click="toggleExpand()" x-show="btExpanded">⤡ 收起</button>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('panel', () => ({
      tab: 'reports',
      subtab: 'overview',
      experiments: [],
      loadingList: false,
      current: null,
      loadingDetail: false,
      selectedInst: 0,
      selectedTrade: 0,
      tradeFilter: 'all',       // 'all' | 'profit' | 'loss' | 'anomaly'
      error: '',
      _chart: null,
      _kchart: null,
      _atKey: null,
      _atCache: null,

      // ===== M2：想法 / 计划 =====
      ideas: [],
      ideaEditingId: null,
      ideaForm: { name:'', instrument:'', timeframe:'', entry_condition:'', exit_condition:'', stop_loss:'', take_profit:'', volume:'', note:'', status:'新想法', author:'DAREWIN' },
      plans: [],
      planEditingId: null,
      planForm: { instrument:'', direction:'多', planned_entry:'', stop_loss:'', target:'', volume:'', planned_date:'', status:'计划中', actual_entry:'', actual_pnl:'', note:'', author:'DAREWIN' },

      // ===== 品种查询 =====
      symbolsLoaded: false,
      allSymbols: [],          // 后端返回的全部品种
      symbolQuery: '',         // 搜索关键词
      filteredSymbols: [],     // 过滤后的品种列表

      // ===== 统计报告 =====
      analyticsLoaded: false,
      analyticsList: [],
      currentReport: null,
      analyticsStarredOnly: false,
      commentForm: { author:'DAREWIN', content:'', conclusion:false },

      // ===== 回测中心 =====
      btSessions: [],           // 会话列表
      btCurrentSessionId: null, // 当前选中会话（用于参数配置上下文）
      btSessionRecords: {},     // 各会话的回测记录 {session_id: [records]}
      btExpandedSessions: {},   // 各会话是否展开 {session_id: bool}
      btParamGroups: [],       // 参数定义（从API获取）
      btDatasets: [],          // 可用品种列表
      btCurrentParams: {},     // 当前参数值
      btSelectedInstruments: [], // 选中的品种
      btLabel: '',             // 回测标注
      btRunning: false,        // 回测执行中
      btCurrentResult: null,   // 当前展示的回测结果
      btCurrentRecordId: null, // 当前选中的记录
      btDatasetSearch: '',     // 品种搜索关键词
      btNewSessionName: '',    // 新建会话输入
      btShowNewSession: false, // 新建会话输入框显示
      btChart: null,           // 右栏 ECharts 实例
      btLoaded: false,         // 回测中心数据是否已加载
      btExpanded: false,       // 展开/全屏模式（隐藏左右栏）
      // ===== 归入会话 =====
      importing: false,
      importSessionId: '',

      async init() {
        await this.loadList();
        // 注册全局回调供交叉引用链接使用
        window.__openReport = (id) => this.openReportById(id);
        window.addEventListener('resize', () => {
          if (this._chart && this.$refs.chart && this.$refs.chart.offsetWidth) this._chart.resize();
          if (this._kchart && this.$refs.kchart && this.$refs.kchart.offsetWidth) this._kchart.resize();
          if (this.btChart) this.btChart.resize();
        });
      },
      async loadList() {
        this.loadingList = true;
        this.error = '';
        try {
          const r = await fetch('/api/reports');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.experiments = await r.json();
        } catch (e) { this.error = '加载回测列表失败，请确认后端已启动：' + e.message; console.error(e); }
        this.loadingList = false;
      },
      async open(id) {
        this.error = '';
        this.loadingDetail = true;
        try {
          const r = await fetch('/api/reports/' + encodeURIComponent(id));
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.current = await r.json();
          const idx = (this.current.instruments || []).findIndex(i => (i.trade_count || 0) > 0);
          this.selectedInst = idx >= 0 ? idx : 0;
          this.subtab = 'overview';
          this.selectedTrade = 0;
          this.$nextTick(() => this.renderChart());
        } catch (e) { this.error = '加载报告详情失败：' + e.message; console.error(e); }
        this.loadingDetail = false;
      },
      back() {
        if (this._chart) { this._chart.dispose(); this._chart = null; }
        if (this._kchart) { this._kchart.dispose(); this._kchart = null; }
        this.current = null;
        this._atKey = null;
        this._atCache = null;
        this.tradeFilter = 'all';
        this.selectedTrade = 0;
        this.error = '';
      },
      // ===== Tab 切换（切到想法/计划时懒加载） =====
      switchTab(t) {
        // 离开回测中心时释放图表
        if (this.tab === 'backtest' && t !== 'backtest') this.disposeBtChart();
        this.tab = t;
        if (t === 'ideas') this.loadIdeas();
        else if (t === 'plans') this.loadPlans();
        else if (t === 'symbols' && !this.symbolsLoaded) this.loadSymbols();
        else if (t === 'analytics' && !this.analyticsLoaded) this.loadAnalytics();
        else if (t === 'backtest') this.initBtData();
      },

      // ===== 想法 CRUD =====
      async loadIdeas() {
        this.error = '';
        try {
          const r = await fetch('/api/ideas');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.ideas = await r.json();
        } catch (e) { this.error = '加载想法失败：' + e.message; console.error(e); }
      },
      async saveIdea() {
        if (!this.ideaForm.name.trim()) { this.error = '策略名不能为空'; return; }
        this.error = '';
        try {
          const opt = { method: this.ideaEditingId ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.ideaForm) };
          const url = this.ideaEditingId ? '/api/ideas/' + this.ideaEditingId : '/api/ideas';
          const r = await fetch(url, opt);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.resetIdeaForm();
          await this.loadIdeas();
        } catch (e) { this.error = '保存想法失败：' + e.message; console.error(e); }
      },
      editIdea(it) {
        this.ideaEditingId = it.id;
        this.ideaForm = { name:it.name, instrument:it.instrument, timeframe:it.timeframe,
          entry_condition:it.entry_condition, exit_condition:it.exit_condition,
          stop_loss:it.stop_loss, take_profit:it.take_profit, volume:it.volume,
          note:it.note, status:it.status, author:it.author };
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      resetIdeaForm() {
        this.ideaEditingId = null;
        this.ideaForm = { name:'', instrument:'', timeframe:'', entry_condition:'', exit_condition:'', stop_loss:'', take_profit:'', volume:'', note:'', status:'新想法', author:'DAREWIN' };
      },
      async setIdeaStatus(it, status) {
        this.error = '';
        try {
          const r = await fetch('/api/ideas/' + it.id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status }) });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          it.status = status;
        } catch (e) { this.error = '更新状态失败：' + e.message; console.error(e); }
      },
      async deleteIdea(id) {
        if (!confirm('确定删除这条想法？')) return;
        this.error = '';
        try {
          const r = await fetch('/api/ideas/' + id, { method:'DELETE' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.ideas = this.ideas.filter(i => i.id !== id);
        } catch (e) { this.error = '删除失败：' + e.message; console.error(e); }
      },
      ideasByStatus(st) { return this.ideas.filter(i => i.status === st); },

      // ===== 计划 CRUD =====
      async loadPlans() {
        this.error = '';
        try {
          const r = await fetch('/api/plans');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.plans = await r.json();
        } catch (e) { this.error = '加载计划失败：' + e.message; console.error(e); }
      },
      async savePlan() {
        if (!this.planForm.instrument.trim()) { this.error = '品种不能为空'; return; }
        this.error = '';
        try {
          const opt = { method: this.planEditingId ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.planForm) };
          const url = this.planEditingId ? '/api/plans/' + this.planEditingId : '/api/plans';
          const r = await fetch(url, opt);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.resetPlanForm();
          await this.loadPlans();
        } catch (e) { this.error = '保存计划失败：' + e.message; console.error(e); }
      },
      editPlan(pl) {
        this.planEditingId = pl.id;
        this.planForm = { instrument:pl.instrument, direction:pl.direction, planned_entry:pl.planned_entry,
          stop_loss:pl.stop_loss, target:pl.target, volume:pl.volume, planned_date:pl.planned_date,
          status:pl.status, actual_entry:pl.actual_entry, actual_pnl:pl.actual_pnl,
          note:pl.note, author:pl.author };
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      resetPlanForm() {
        this.planEditingId = null;
        this.planForm = { instrument:'', direction:'多', planned_entry:'', stop_loss:'', target:'', volume:'', planned_date:'', status:'计划中', actual_entry:'', actual_pnl:'', note:'', author:'DAREWIN' };
      },
      async setPlanStatus(pl, status) {
        this.error = '';
        try {
          const r = await fetch('/api/plans/' + pl.id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status }) });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          pl.status = status;
        } catch (e) { this.error = '更新状态失败：' + e.message; console.error(e); }
      },
      async deletePlan(id) {
        if (!confirm('确定删除这条计划？')) return;
        this.error = '';
        try {
          const r = await fetch('/api/plans/' + id, { method:'DELETE' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.plans = this.plans.filter(p => p.id !== id);
        } catch (e) { this.error = '删除失败：' + e.message; console.error(e); }
      },
      plansByStatus(st) { return this.plans.filter(p => p.status === st); },
      parsePnl(s) { const m = String(s == null ? '' : s).replace(/[^0-9.-]/g, ''); const n = Number(m); return isNaN(n) ? null : n; },

      // ===== 品种查询 =====
      async loadSymbols() {
        this.error = '';
        try {
          const r = await fetch('/api/symbols');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          this.allSymbols = data.varieties || [];
          this.filteredSymbols = this.allSymbols;
          this.symbolsLoaded = true;
        } catch (e) { this.error = '加载品种数据失败：' + e.message; console.error(e); }
      },
      filterSymbols() {
        const q = this.symbolQuery.trim().toLowerCase();
        if (!q) { this.filteredSymbols = this.allSymbols; return; }
        this.filteredSymbols = this.allSymbols.filter(v => {
          const hay = (v.prefix + ' ' + (v.name||'') + ' ' + (v.exchange||'')).toLowerCase();
          return hay.includes(q);
        });
      },
      get symbolExchanges() {
        return [...new Set(this.filteredSymbols.map(v => v.exchange))].sort();
      },
      filteredSymbolsByExchange(ex) {
        return this.filteredSymbols.filter(v => v.exchange === ex);
      },
      exFullName(ex) {
        const map = { SHFE: '上海期货交易所 (SHFE)', DCE: '大连商品交易所 (DCE)', CZCE: '郑州商品交易所 (CZCE)', '?': '其他' };
        return map[ex] || ex;
      },

      // ===== 统计报告 =====
      filteredAnalytics() {
        if (!this.analyticsStarredOnly) return this.analyticsList;
        return this.analyticsList.filter(r => r.starred);
      },
      async toggleStar(report_id, e) {
        if (e) { e.stopPropagation(); }
        try {
          const r = await fetch(`/api/analytics/${report_id}/star`, { method: 'POST' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          // 同步更新列表中的状态
          const item = this.analyticsList.find(x => x.report_id === report_id);
          if (item) item.starred = data.starred;
        } catch (e) { this.error = '星标失败：' + e.message; }
      },
      async loadAnalytics() {
        this.error = '';
        try {
          const r = await fetch('/api/analytics');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.analyticsList = await r.json();
          this.analyticsLoaded = true;
        } catch (e) { this.error = '加载统计报告失败：' + e.message; console.error(e); }
      },
      async openReport(id) {
        this.error = '';
        try {
          const r = await fetch(`/api/analytics/${id}`);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.currentReport = await r.json();
        } catch (e) { this.error = '加载报告详情失败：' + e.message; console.error(e); }
      },
      async submitComment() {
        if (!this.commentForm.content.trim() || !this.currentReport) return;
        try {
          const r = await fetch(`/api/analytics/${this.currentReport.report_id}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.commentForm),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          this.commentForm.content = '';
          this.commentForm.conclusion = false;
          // 重新加载评论
          await this.openReport(this.currentReport.report_id);
        } catch (e) { this.error = '提交评论失败：' + e.message; }
      },
      async deleteComment(id) {
        if (!confirm('确定删除这条评论？')) return;
        try {
          const r = await fetch(`/api/analytics/comments/${id}`, { method: 'DELETE' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          await this.openReport(this.currentReport.report_id);
        } catch (e) { this.error = '删除失败：' + e.message; }
      },

      s() { return (this.current && this.current.summary) || {}; },
      curInst() { return this.current && this.current.instruments && this.current.instruments[this.selectedInst]; },
      // 下拉框只列有交易的品种；it.i 保留原 instruments 数组索引，故 curInst()/selectedInst 无需改动。
      // 无交易品种不进下拉框（靠指标卡"有交易品种 X/Y"体现），避免"切到无交易品种但曲线还在"的困惑。
      instsTraded() {
        if (!this.current) return [];
        return this.current.instruments
          .map((inst, i) => ({ inst, i }))
          .filter(o => (o.inst.trade_count || 0) > 0);
      },

      // ---- 交易筛选 ----
      instIcon(instrument) {
        const sym = (instrument || '').toUpperCase().replace(/0$/, '');
        if (sym === 'AU') return '\u{1F947} ';  // \u{1F947} = gold medal
        if (sym === 'AG') return '\u{1F948} ';  // \u{1F948} = silver medal
        return '';
      },
      filteredTrades() {
        const all = this.allTrades();
        if (this.tradeFilter === 'all') return all;
        return all.filter(it => {
          if (this.tradeFilter === 'profit') return (it.trade.net_pnl || 0) > 0;
          if (this.tradeFilter === 'loss') return (it.trade.net_pnl || 0) < 0;
          if (this.tradeFilter === 'anomaly') return this.isAnomaly(it.trade);
          return true;
        });
      },
      isAnomaly(t) {
        if (!t) return false;
        if ((t.holding_days || 0) > 20) return true;
        if ((t.return_rate || 0) <= -50) return true;
        return false;
      },
      anomalyText(t) {
        if (!t) return '';
        const reasons = [];
        if ((t.holding_days || 0) > 20) reasons.push('持仓' + t.holding_days + '天');
        if ((t.return_rate || 0) <= -100) reasons.push('保证金亏光');
        else if ((t.return_rate || 0) <= -50) reasons.push('亏损' + Math.abs(t.return_rate || 0).toFixed(1) + '%');
        return '异常：' + reasons.join('，');
      },

      renderChart() {
        // Alpine 3 的 x-ref 在 <template x-if> 动态插入的 DOM 上有绑定延迟/不注册问题：
        // open() 后 this.$refs.chart 可能长期为 undefined（即使 #chart 已在 DOM 里且可见），
        // 导致首次进入报告曲线画不出，要手动切品种触发 effect flush 后 $refs 才绑定。
        // fallback 到 getElementById，#chart 一插入 DOM 就能立即拿到。
        const el = this.$refs.chart || document.getElementById('chart');
        // open() 里 current 赋值后用 $nextTick 调本函数，但此时 Alpine x-if 的详情 DOM
        // 可能还没插入（$refs.chart 为 undefined），或刚插入尚未布局（offsetWidth/Height 为 0）。
        // echarts 在 0 尺寸宿主上 init 会建 0 尺寸实例且之后不自动恢复——表现为首次进入
        // 报告曲线空白、手动切品种重新 init 才出现。统一用 RAF 等到 el 就绪，30 帧上限防死循环。
        if (this.current && (!el || !el.offsetWidth || !el.offsetHeight) && (this._chartRetry | 0) < 30) {
          this._chartRetry = (this._chartRetry | 0) + 1;
          requestAnimationFrame(() => this.renderChart());
          return;
        }
        this._chartRetry = 0;
        if (!el || !this.current) return;

        // 兜底清理 DOM 上可能残留的旧 echarts 实例。若只依赖 this._chart 引用，
        // 一旦它与 DOM 真实实例不同步（x-if 复用同一 #chart DOM / nextTick 时序），
        // echarts.init(el) 会复用旧实例并把新 option merge 上去——空 trades 无法清除旧 series，
        // 于是无交易报告仍会显示上一个报告的曲线。用 getInstanceByDom 彻底清理。
        const stale = echarts.getInstanceByDom(el);
        if (stale) stale.dispose();
        this._chart = null;

        const trades = [];
        for (const inst of this.current.instruments) {
          for (const t of (inst.trades || [])) {
            trades.push({ date: t.close_date, pnl: t.net_pnl || 0 });
          }
        }

        // 无交易：彻底清空图表区域并提示，不再绘制坐标系，避免任何残留。
        if (!trades.length) {
          el.innerHTML = '<div class="empty" style="display:flex;align-items:center;justify-content:center;height:100%">本报告无交易记录</div>';
          return;
        }

        trades.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        let cum = 0;
        const xs = [], ys = [];
        for (const t of trades) { cum += t.pnl; xs.push(t.date); ys.push(+cum.toFixed(2)); }
        // 清空宿主元素（可能残留上次"无交易"提示或 dispose 后的容器），避免与新图叠加
        el.innerHTML = '';
        this._chart = echarts.init(el, 'dark');
        this._chart.setOption({
          backgroundColor: 'transparent',
          grid: { left: 64, right: 20, top: 20, bottom: 40 },
          tooltip: { trigger: 'axis' },
          xAxis: { type: 'category', data: xs, axisLabel: { color: '#8b93a1' } },
          yAxis: { type: 'value', name: '累计盈亏', axisLabel: { color: '#8b93a1' }, splitLine: { lineStyle: { color: '#2a2f3a' } } },
          series: [{
            type: 'line', step: 'end', showSymbol: true, symbolSize: 6,
            data: ys, lineStyle: { width: 2, color: '#e5484d' },
            areaStyle: { opacity: 0.12, color: '#e5484d' }
          }]
        });
      },

      switchSub(s) {
        this.subtab = s;
        if (s === 'overview') this.$nextTick(() => this.renderChart());
        else {
          // 切到复盘时，如果当前 filter 导致列表变短，重置选中索引防止越界
          if (this.selectedTrade >= this.filteredTrades().length) this.selectedTrade = 0;
          this.$nextTick(() => this.renderKline());
        }
      },

      allTrades() {
        if (!this.current) return [];
        const key = this.current.experiment_id;
        if (key && this._atKey === key && this._atCache) return this._atCache;
        const out = [];
        for (let ii = 0; ii < (this.current.instruments || []).length; ii++) {
          const inst = this.current.instruments[ii];
          for (let ti = 0; ti < (inst.trades || []).length; ti++) {
            const t = inst.trades[ti];
            const od = (t.open_date || '').slice(5), cd = (t.close_date || '').slice(5);
            out.push({
              instIdx: ii, tradeIdx: ti, inst, trade: t,
              label: `${this.instIcon(inst.instrument)}${inst.instrument} · #${t.no || (ti + 1)} · ${od}→${cd} · ${this.fmtMoney(t.net_pnl)}`,
            });
          }
        }
        this._atKey = key;
        this._atCache = out;
        return out;
      },
      curTrade() {
        const at = this.filteredTrades();
        const it = at[this.selectedTrade];
        return (it && it.trade) || null;
      },
      curChart() {
        const at = this.filteredTrades();
        const it = at[this.selectedTrade];
        return (it && it.trade && it.trade.chart) || null;
      },
      replayTitle() {
        const at = this.filteredTrades();
        const it = at[this.selectedTrade];
        if (!it) return '';
        return `${this.instIcon(it.inst.instrument)}${it.inst.instrument} · ${it.inst.kline_style} · ${this.dirLabel(this.current.direction)}`;
      },

      renderKline() {
        // 同 renderChart：x-ref 在 <template x-if> 动态 DOM 上可能不绑定，fallback 到 getElementById；
        // 切到 replay 时 kchart 父容器刚 display:block 可能尚未布局，RAF 等到就绪再 init。
        const el = this.$refs.kchart || document.getElementById('kchart');
        if (this.current && (!el || !el.offsetWidth || !el.offsetHeight) && (this._kchartRetry | 0) < 30) {
          this._kchartRetry = (this._kchartRetry | 0) + 1;
          requestAnimationFrame(() => this.renderKline());
          return;
        }
        this._kchartRetry = 0;
        if (!el) return;
        const at = this.filteredTrades();
        if (!at.length) return;
        const item = at[this.selectedTrade];
        const chart = item && item.trade && item.trade.chart;
        if (!chart) {
          const s = echarts.getInstanceByDom(el); if (s) s.dispose();
          this._kchart = null; el.innerHTML = '';
          return;
        }

        const klines = chart.klines;
        const cats = klines.map(k => k.date);
        const ohlc = klines.map(k => [k.open, k.close, k.low, k.high]);
        const up = klines.map(k => k.bb_upper);
        const mid = klines.map(k => k.bb_mid);
        const low = klines.map(k => k.bb_lower);

        const m = chart.markers || {};
        // coord 用类目名(日期)而非索引，避免 category 轴定位歧义；
        // markLine 两点连线必须用 [{coord},{coord}] 数组格式——echarts3 的 {coord,coord2} 旧写法在 echarts5 会抛 "Cannot read 'coord' of undefined"
        const has = d => !!(d && cats.indexOf(d) >= 0);
        const oD = m.open && m.open.date, cD = m.close && m.close.date, hD = m.h_left && m.h_left.date;
